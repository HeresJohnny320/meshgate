name: rust

# meshgate (rust/) on every platform. Releases are the Rust build and only
# happen when this workflow passed (release.yml).
on:
  # Every push to main: releases wait for this workflow (see release.yml).
  push:
    branches: [main]
  pull_request:
    paths: ["rust/**", "test/**", "go/mobile/android/**", "go/mobile/ios/**", ".github/workflows/rust.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup target add x86_64-unknown-freebsd
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: FreeBSD/pfSense build type-checks
        run: cargo check --locked --target x86_64-unknown-freebsd

  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-lab-${{ hashFiles('rust/Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y wireguard-tools nftables iptables
      - name: build the Rust binary and the phone simulator
        run: cd rust && cargo build --release --locked --bins
      - name: end-to-end lab against the Rust build
        run: sudo unshare -n -m sh test/e2e/lab.sh "$PWD/rust/target/release/meshgate" "$PWD/rust/target/release/phonesim"

  # The Android app with the Rust engine (debug APK; releases build it in
  # release.yml).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-android-${{ hashFiles('rust/Cargo.lock') }}
      - name: engine
        working-directory: rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a clippy --locked -p meshcore -- -D warnings
          make android-core
      - name: APK
        working-directory: go/mobile/android
        run: ./gradlew --no-daemon assembleDebug

  # The iOS app with the Rust engine: builds the xcframework and compiles the
  # app and tunnel extension (unsigned; there is no Apple team in CI).
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-ios-${{ hashFiles('rust/Cargo.lock') }}
      - name: engine
        working-directory: rust
        run: make ios-core
      - name: app
        working-directory: go/mobile/ios
        run: |
          xcodegen
          xcodebuild -project MeshGate.xcodeproj -target MeshGate -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

  # A Windows node for real: Wintun adapter, the service, the local API pipe
  # (test/windows/smoke.ps1).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-windows-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: node smoke test
        run: ../test/windows/smoke.ps1 "$PWD/target/release" amd64

  # A macOS node for real: utun, launchd, the local API socket.
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-macos-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: node smoke test
        run: |
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 target/release/meshgate /usr/local/bin/meshgate
          sudo meshgate init --role controller -y --name mac --admin-pass labpassword
          sudo meshgate service install
          for i in $(seq 30); do sudo meshgate status >/dev/null 2>&1 && break; sleep 1; done
          sudo meshgate status || { sudo tail -50 /var/log/meshgate.log; exit 1; }
          ifconfig | grep -A4 '^utun'
          sudo meshgate service uninstall

  # The FreeBSD/pfSense lab (vnet jails, real if_wg, pf with pfSense's
  # anchor layout) against the Rust FreeBSD build, in a FreeBSD VM.
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cross-build for FreeBSD
        working-directory: rust
        run: |
          rustup toolchain install stable --profile minimal
          cargo install cross --locked
          export MESHGATE_GO_DIR="$(cd .. && pwd)/go"   # mounted into cross's container (Cross.toml)
          cross build --release --locked --target x86_64-unknown-freebsd
          cp target/x86_64-unknown-freebsd/release/meshgate ../meshgate-freebsd
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y wireguard-tools python3
          run: sh test/freebsd/lab.sh "$PWD/meshgate-freebsd"

  # The two builds cross has no image for (rust/build-extra.sh), built the way
  # releases build them, then run on real arm64 below.
  arm64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update && sudo apt-get install -y clang lld llvm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-arm64-${{ hashFiles('rust/Cargo.lock', 'rust/build-extra.sh') }}
      - run: ./build-extra.sh aarch64-unknown-freebsd
      - run: ./build-extra.sh aarch64-pc-windows-gnullvm
      - run: |
          mkdir -p ../arm64
          cp target/aarch64-unknown-freebsd/release/meshgate ../arm64/meshgate-freebsd
          cp target/aarch64-pc-windows-gnullvm/release/meshgate.exe ../arm64/
          file ../arm64/*
      - uses: actions/upload-artifact@v4
        with:
          name: arm64
          path: arm64/

  windows-arm64:
    needs: arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arm64
          path: arm64
      - name: node smoke test
        shell: pwsh
        run: test/windows/smoke.ps1 "$PWD/arm64" arm64

  # The FreeBSD/pfSense lab on arm64 (Netgate 1100/2100), in an emulated
  # arm64 FreeBSD VM.
  freebsd-arm64:
    needs: arm64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arm64
          path: arm64
      - run: chmod +x arm64/meshgate-freebsd
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          arch: aarch64
          usesh: true
          prepare: pkg install -y wireguard-tools python3
          run: sh test/freebsd/lab.sh "$PWD/arm64/meshgate-freebsd"
