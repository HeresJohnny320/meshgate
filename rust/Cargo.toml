[package]
name = "meshgate"
version = "0.0.0" # the release version is passed in MESHGATE_VERSION at build time
edition = "2024"
license-file = "../LICENSE"
publish = false

[dependencies]
base64 = "0.22"
bcrypt = "0.15"
bytes = "1"
crc32fast = "1"
crossterm = { version = "0.28", default-features = false, features = ["events", "bracketed-paste"] }
flate2 = "1"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
instant-acme = { version = "0.7", default-features = false, features = ["ring", "hyper-rustls"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "fs", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
unicode-width = "0.2"
webpki-roots = "0.26"
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-parser = { version = "0.16", features = ["verify"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
boringtun = { version = "0.7", features = ["device"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
